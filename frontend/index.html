
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF to Editable PPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="background-mesh"></div>
    <div class="app-container">
      <div class="glass-card">
        <header>
          <h1>PDF to PPT <span class="badge">Pro</span></h1>
          <p>Convert NotebookLM PDFs to editable PowerPoint while keeping the beautiful background.</p>
        </header>

        <div id="dropzone" class="dropzone">
          <div class="dropzone-content expanded">
            <div class="icon-file">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 2V8H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 18V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 15L12 12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h3>Drop your PDF here</h3>
            <p class="subtext">or click to browse</p>
          </div>
          
          <div id="loading" class="loading-state hidden">
            <div class="spinner"></div>
            <p>Cleaning Backgrounds & Extracting Text...</p>
          </div>
          
          <div id="success" class="success-state hidden">
             <div class="icon-check">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke-linecap="round" stroke-linejoin="round"></path>
                <polyline points="22 4 12 14.01 9 11.01" stroke-linecap="round" stroke-linejoin="round"></polyline>
              </svg>
            </div>
            <h3>Conversion Complete!</h3>
            <button id="downloadBtn" class="btn-primary">Download PPTX</button>
            <button id="resetBtn" class="btn-secondary">Convert Another</button>
          </div>
          
          <input type="file" id="fileInput" accept=".pdf" hidden />
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
